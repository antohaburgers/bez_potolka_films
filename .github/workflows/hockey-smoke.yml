name: Hockey Tyan technical smoke
on:
  workflow_dispatch:
  push:
    branches: [hockey-tyan-v01]
    paths: ['hockey/**', '.github/workflows/hockey-smoke.yml']
  pull_request:
    branches: [main]
    paths: ['hockey/**', '.github/workflows/hockey-smoke.yml']
permissions:
  contents: read
concurrency:
  group: hockey-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install 'numpy<2' omegaconf Pillow
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - name: Render technical test
        run: python hockey/render.py hockey/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: hockey-smoke
          path: hockey-output/
          retention-days: 3
          if-no-files-found: error
