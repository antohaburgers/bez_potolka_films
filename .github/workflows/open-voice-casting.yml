name: Open voice casting

on:
  push:
    branches: [hockey-tyan-open-voices]
    paths: [voice_casting_open.py, .github/workflows/open-voice-casting.yml]
  workflow_dispatch:
    inputs:
      line_1:
        required: true
        type: string
      line_2:
        required: true
        type: string
      line_3:
        required: true
        type: string
      line_4:
        required: true
        type: string

permissions:
  contents: read

jobs:
  casting:
    strategy:
      fail-fast: false
      matrix:
        backend: [kitten, qwen]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KittenTTS on CPU
        if: matrix.backend == 'kitten'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install 'transformers==5.2.0' 'kittenml @ git+https://github.com/KittenML/KittenTTS.git@5802f6b956844919ecf210f4e55f4750a6ad7c6f'
      - name: Prepare Qwen CPU runner
        if: matrix.backend == 'qwen'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
          python -m pip install numpy soundfile
          git init "$RUNNER_TEMP/qwen"
          git -C "$RUNNER_TEMP/qwen" fetch --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts.git ef339be58a778b062e1c14382347964552eae007
          git -C "$RUNNER_TEMP/qwen" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/qwen" -j4 qwen_tts
          bash "$RUNNER_TEMP/qwen/download_model.sh" --model large --dir "$RUNNER_TEMP/qwen-model"
      - name: Render casting
        env:
          BACKEND: ${{ matrix.backend }}
          HF_HUB_DISABLE_XET: "1"
          LINE_1: ${{ inputs.line_1 }}
          LINE_2: ${{ inputs.line_2 }}
          LINE_3: ${{ inputs.line_3 }}
          LINE_4: ${{ inputs.line_4 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf '%s\n' "$LINE_1" "$LINE_2" "$LINE_3" "$LINE_4"
          else
            printf '%s\n' 'Привет! Начинаем хоккейный обзор.' 'Неожиданно! Десять — ноль!' 'Болельщики расстроены…' 'До встречи в следующем выпуске!'
          fi > "$RUNNER_TEMP/dialogue.txt"
          case "$BACKEND" in
            kitten) python voice_casting_open.py kitten "$RUNNER_TEMP/dialogue.txt" --output output ;;
            qwen) python voice_casting_open.py qwen "$RUNNER_TEMP/dialogue.txt" --engine "$RUNNER_TEMP/qwen" --model "$RUNNER_TEMP/qwen-model" --output output ;;
          esac
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.backend }}-casting
          path: output/*_polina.wav
          retention-days: 1
          if-no-files-found: error
