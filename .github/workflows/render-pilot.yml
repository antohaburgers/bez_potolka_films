name: Render Hockey-tyan pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hockey-tyan-pilot
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENGINE_SHA: ef339be58a778b062e1c14382347964552eae007
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libopenblas-dev ffmpeg curl fonts-dejavu-core
          python -m pip install Pillow==11.3.0
          python -m py_compile render_pilot.py
      - name: Build approved Qwen C engine
        run: |
          git init engine
          git -C engine remote add origin https://github.com/gabriele-mastrapasqua/qwen3-tts.git
          git -C engine fetch --depth=1 origin "$ENGINE_SHA"
          git -C engine checkout --detach FETCH_HEAD
          make -C engine blas
      - name: Download approved voice model
        working-directory: engine
        run: |
          bash download_model.sh --model large
          bash download_assets.sh --no-voices
      - name: Synthesize voice and render video
        run: python render_pilot.py
      - name: Upload finished reel
        uses: actions/upload-artifact@v4
        with:
          name: hockey-tyan-pilot
          path: reel-output/
          retention-days: 7
          if-no-files-found: error
