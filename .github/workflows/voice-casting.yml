name: Voice casting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - voice_casting.py
      - .github/workflows/voice-casting.yml
permissions:
  contents: read
jobs:
  casting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install 'numpy<2' omegaconf
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Generate voice previews
        run: python voice_casting.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-casting
          path: output/
          retention-days: 1
          if-no-files-found: error
